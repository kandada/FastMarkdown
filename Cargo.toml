[package]
name = "fastmarkdown"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "Blazing fast cross-platform Markdown renderer with native object output for iOS/Android"
license = "Apache-2.0"
authors = ["xiefujin <490021684@qq.com>"]
repository = "https://github.com/kandada/fastshell"
homepage = "https://github.com/kandada/fastshell"
documentation = "https://docs.rs/fastmarkdown"
readme = "README.md"
keywords = ["markdown", "renderer", "ios", "android", "ffi"]
categories = ["text-processing", "rendering", "parsing"]
exclude = ["design.md"]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
ammonia = "4"
thiserror = "2"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"], optional = true }

[features]
default = []
highlight = ["syntect"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "render"
harness = false
